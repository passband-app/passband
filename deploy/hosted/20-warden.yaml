# The warden itself: one Deployment, one Service, one Ingress.
#
# EDIT BEFORE APPLYING. Three values in this file are placeholders and all
# will break the deploy if they are left alone:
#
#   1. `image:` on the Deployment          -> your squelch-warden image
#   2. `host:` on both Ingresses           -> warden.<your domain>
#   3. `sourceRange:` on the Middleware    -> the addresses that may call the API
#
# Everything this process is CONFIGURED with is in `15-warden-config.yaml`,
# which is where your domain, the squelchd image tenants run and the control
# plane's origin are set. One ConfigMap rather than an env block here, because
# the fleet roller in `90-warden-roller.yaml` renders the same tenants from the
# same values and two copies that disagree rewrite the same tenant forever;
# that file's header has the long version. Apply it BEFORE this one, and
# `rollout restart` this Deployment whenever it changes: `envFrom` is read once,
# when a pod starts.
#
# The bearer token is NOT in either. It comes from the `squelch-warden` Secret
# in this namespace; see `warden-token.example.yaml`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squelch-warden
  namespace: warden
  labels:
    app.kubernetes.io/name: squelch-warden
spec:
  replicas: 1
  # Two wardens racing on the same label would both be settled correctly by the
  # API server (the loser of `create` gets 409), but there is no reason to have
  # two, and Recreate keeps the rollout honest.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: squelch-warden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squelch-warden
    spec:
      serviceAccountName: squelch-warden
      # The one pod in this deployment that DOES need an API token. Tenant pods
      # set this to false.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: warden
          # 1. EDIT ME. The SAME tag `90-warden-roller.yaml` names: this binary
          # is the renderer, and a roller on an older one renders older tenants.
          # An image is a pod-spec field, so it is the one value the ConfigMap
          # cannot hold for both of them.
          image: ghcr.io/passband-app/squelch-warden:daemon-0.0.18
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8852
          # Every knob this process reads, from the one object the roller reads
          # too. Nothing is restated as an `env:` entry below: a container
          # `env:` name outranks the same name from `envFrom` silently, and a
          # value overridden in one pod spec and not the other is exactly the
          # divergence the shared ConfigMap exists to prevent.
          envFrom:
            - configMapRef:
                name: squelch-warden-config
          env:
            # The one value that is not configuration: the bearer the control
            # plane presents, from a Secret rather than a ConfigMap.
            - name: SQUELCH_WARDEN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: squelch-warden
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        # The warden writes nothing to disk. This exists so the read-only root
        # filesystem has somewhere for a library to put a scratch file.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: squelch-warden
  namespace: warden
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: squelch-warden
  ports:
    - name: http
      port: 8852
      targetPort: http
---
# Who may reach the API at all. The bearer token is the real credential, but
# it is one static token that can read every tenant's Secret (10-warden-rbac),
# so it should not also be usable from anywhere on the internet. This list is
# the second factor: a leaked token is worth nothing from an address not on it.
#
# REQUIRES real client IPs at Traefik: apply 05-traefik-metrics.yaml (it sets
# externalTrafficPolicy: Local) FIRST, or every caller looks like a cluster
# address and this list refuses control too.
#
# Control calls from a fixed address: it egresses through the NAT EIP,
# `tofu -chdir=deploy/aws/tofu/main output -raw nat_egress_ip`. The manifest
# carries the token CONTROL_NAT_EIP; substitute it before applying (SETUP.md).
#
# Operators: call the API from the box itself through a port-forward,
#   kubectl -n warden port-forward svc/squelch-warden 8852:8852
# rather than adding a laptop address here. /healthz stays public (the
# second Ingress below) so blackbox can keep probing it from wherever it runs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: warden-allowlist
  namespace: warden
spec:
  ipAllowList:
    sourceRange:
      # 3. EDIT ME: control's egress (the AWS NAT EIP), as a /32.
      - CONTROL_NAT_EIP/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squelch-warden
  namespace: warden
  annotations:
    # <namespace>-<middleware name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: warden-warden-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    # The warden lives on the PRODUCT domain, not the tenant one: `*.passband.email`
    # is reserved to mean "a tenant" and nothing else, so internal surfaces go
    # through passband.app. 40-wildcard-certificate.yaml issues warden-tls for
    # this single host over HTTP-01 (cert-manager's solver Ingress is its own
    # object, without this middleware, so renewals are not blocked).
    - hosts:
        # 2. EDIT ME
        - warden.passband.app
      secretName: warden-tls
  rules:
    # 2. EDIT ME
    - host: warden.passband.app
      http:
        paths:
          # Every path goes to the service, from allowlisted addresses only.
          # The whole API is also behind the bearer.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squelch-warden
                port:
                  name: http
---
# /healthz, from anywhere: it says only `ok`, and the blackbox probe
# (deploy/monitoring/prometheus/prometheus.yml) is not on the allowlist. An
# Exact path outranks the Prefix route above, so only this one path is open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squelch-warden-healthz
  namespace: warden
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        # 2. EDIT ME
        - warden.passband.app
      secretName: warden-tls
  rules:
    # 2. EDIT ME
    - host: warden.passband.app
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: squelch-warden
                port:
                  name: http
