# Where alerts go: one Slack channel, through an incoming webhook.
#
# A webhook, not a Slack app. An alert channel only ever RECEIVES; a bot token,
# scopes and an interactive endpoint buy acknowledge buttons that a team of one
# does not need, and they are one more credential to rotate.
#
# SLACK_ALERTS_WEBHOOK_URL lives in Secrets Manager
# (passband/monitor/SLACK_ALERTS_WEBHOOK_URL), never in this repo: whoever holds the URL can post into the channel.
#
# SET IT BEFORE THIS FILE REACHES `main`. The monitor box deploys itself on
# merge (deploy-aws.yml), and Grafana refuses to start with a Slack receiver
# that has no URL, so the container exits at boot and the monitor deploy job
# fails ("not healthy after 3 minutes"). Nothing alerts while it is down.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: passband-slack
        type: slack
        disableResolveMessage: false
        settings:
          url: $SLACK_ALERTS_WEBHOOK_URL
          title: '{{ template "passband.title" . }}'
          text: '{{ template "passband.text" . }}'
