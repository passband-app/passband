[package]
name = "squelch-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The shared constant-time compare, so the device-token verify path uses the
# SAME primitive as both doors' bearer checks instead of a third copy. The
# dependency runs core -> httpauth only; httpauth stays a leaf, so the relay
# still links it without dragging the mail core in.
squelch-httpauth = { path = "../squelch-httpauth" }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
psl = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
# NFKC for the calendar reminder line's drop test (gcal/remind.rs), so a
# fullwidth `ｅｖｉｌ．ｃｏｍ` is read as the host it is. Already in the tree
# under `idna` (url); named here only to call it.
unicode-normalization = "0.1"
async-trait = { workspace = true }
oauth2 = { workspace = true }
keyring-core = { workspace = true }
age = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tiny_http = { workspace = true }
webbrowser = { workspace = true }
url = { workspace = true }
# `blocking` for two synchronous callers. The consent-broker flow: `squelchd
# auth` runs before any runtime exists (the loopback flow already blocks on a
# TcpListener there), so the broker's register/poll calls are on the same
# synchronous path. And `embed::RemoteEmbedder`, which implements the sync
# `Embedder` trait and is only ever called under `spawn_blocking`. Everything
# else in this crate uses the async client.
reqwest = { workspace = true, features = ["blocking"] }
# The wire contract with the shared embedding service (docs/EMBED-SERVICE.md),
# and nothing else: `default-features = false` drops the `server` half, so this
# links serde types and constants, not a second copy of the service.
squelch-embed = { path = "../squelch-embed", default-features = false }
mail-parser = { workspace = true }
base64 = { workspace = true }
ammonia = "4"
# THE IMAP SOURCE (`mail/imap.rs`, issue #575). async-imap on tokio, default
# features off because the default runtime is async-std. TLS is rustls with
# RING, the workspace's one crypto backend (see squelch-control), over the
# webpki root set reqwest already trusts: no native-tls/openssl in the tree.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
# async-imap `log::trace!`s every line it writes and reads, the LOGIN line
# (the password) and message bodies included. `max_level_debug` compiles every
# trace call out at build time, and Cargo unifies features, so it holds for
# every crate in any binary that links this one. Nothing in the workspace
# reads trace-level `log` output (the hosted services' tracing-subscriber
# filters default to info). `release_max_level_debug` holds the same line in
# release builds, where log reads the release_* features INSTEAD: without it a
# dependency enabling `release_max_level_trace` would turn the LOGIN trace back
# on in the shipped binary, and with it a conflicting one is a compile error.
# Pinned at compile time by the const assert in `mail/imap.rs`, in every profile.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
sha2 = "0.11"
# OS entropy for read-tracking tokens. Deliberately the raw syscall wrapper
# rather than a PRNG crate: a tracking token is minted once and must be
# unguessable, so there is nothing to seed and nothing to reseed.
getrandom = "0.3"
# SO_REUSEADDR on the consent listener, which std::net cannot set before bind.
# The fixed-port flows (`auth --write --headless`) bind the same port twice in
# one run, and on Linux the first flow's connection in TIME_WAIT refuses the
# second bind without it.
socket2 = "0.6"
fastembed = { workspace = true }
# Already in the tree under fastembed, named here only so the first-download
# notice can ask hf-hub's own cache whether a model's snapshot pointer resolves
# instead of guessing from the directory listing (see `embed/fastembed_impl.rs`).
# default-features off, which is how fastembed takes it, so this line compiles
# nothing new: the downloader features stay fastembed's to turn on.
hf-hub = { version = "0.5", default-features = false }
sqlite-vec = { workspace = true }
zerocopy = { workspace = true }
whatlang = { workspace = true }

# Two uses. `malloc_trim` behind `mem::trim`, which is how a dropped embedding
# session's heap actually leaves the process (see `mem.rs` for the
# measurements); that call is a glibc entry point and is cfg-gated to glibc in
# the source. And `statvfs` behind the archive walk's free-space floor
# (`Store::archive_disk`), which every unix has, the self-hosted Mac
# included. So the dependency is scoped to unix rather than to glibc.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The one OS keyring the `keyring` credential backend has: the macOS keychain.
# Elsewhere the backend is refused up front and `file` is the backend
# (`credentials::ensure_backend`); see the workspace manifest for what linking
# a Linux store cost.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[dev-dependencies]
# The APNs pusher's tests bind a MOCK RELAY on an ephemeral loopback port and
# assert on the exact bytes that leave the daemon — "the relay is blind" is only
# a real guarantee if it is checked on the wire, not on a struct. Same axum 0.8
# line the rest of the workspace pins.
axum = { version = "0.8" }
# Virtual time (`#[tokio::test(start_paused = true)]`) for the tests that assert
# a wall-clock BOUND instead of sitting through it: the rule-inference budget
# wraps a retry ladder whose real duration is minutes. tokio's "full" feature set
# deliberately leaves test-util out, so it is asked for here.
tokio = { workspace = true, features = ["test-util"] }
# The claim-plan regression test times the claiming thread's CPU, not the wall
# clock: a loaded CI runner stretches wall time past any honest threshold while
# the work a history scan adds shows up in CPU either way.
libc = { workspace = true }
