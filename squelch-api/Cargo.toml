[package]
name = "squelch-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "squelch_api"
path = "src/lib.rs"

[[bin]]
name = "squelch-api"
path = "src/bin/squelch-api.rs"

[dependencies]
squelch-core = { path = "../squelch-core" }
# Constant-time bearer compare + `Authorization` parse, shared byte-for-byte
# with squelch-relay so a fix to either lands in one place.
squelch-httpauth = { path = "../squelch-httpauth" }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# Full-feature axum for JSON extractors, query, path, and routing. Tracks the
# same axum 0.8 line squelch-mcp pins.
axum = { version = "0.8" }
tower = "0.5"
# `ReceiverStream` only: the SSE endpoint hands axum a stream fed by a per-
# connection pump task. Default features (no `sync`) are enough.
tokio-stream = "0.1"
# CORS for the desktop client's webview (tauri://localhost / vite dev origin).
# CORS is a browser courtesy, not the security boundary — bearer auth is.
# `compression-gzip` for the response bodies the client polls (the feed, the
# thread view with every message's HTML inline, search): gzip only, because
# every client and proxy speaks it and `flate2` is already in the tree, where
# brotli would be a new crate for ~15% more on JSON.
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tokio-util = "0.7"
# Gmail write ops: HTTP client (rustls, no native-tls) mirroring the read
# engine, base64url for send payloads, regex for the outbound secret guard.
# `stream` on top of the workspace set: the assistant relay hands the upstream
# SSE body to axum verbatim, and `Response::bytes_stream` is feature-gated.
# `cookies` for the automatic unsubscribe: a confirm form often needs the
# session cookie its own page set (one jar per job, see src/unsub_fetch.rs).
reqwest = { workspace = true, features = ["stream", "cookies"] }
# Url joining and form encoding for the automatic unsubscribe's fetcher.
url = { workspace = true }
# The automatic unsubscribe's browser rung speaks the Chrome DevTools Protocol
# to a rented remote browser over one WebSocket (src/unsub_cdp.rs). rustls with
# webpki roots, matching reqwest; `futures` for the socket's split halves.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
# Markdown → HTML for the send path's multipart/alternative body. `html` only;
# raw HTML in the source is escaped in src/markdown.rs, never passed through.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Structured parsing of the parent's address-list headers (To/Cc/From/Reply-To)
# when deriving reply-all recipients. The same parser core uses at ingest, so
# both doors read a display name containing a comma the same way — splitting on
# commas ourselves is what would produce a wrong (or attacker-chosen) audience.
mail-parser = { workspace = true }
# Implementing squelch-core's `AgentMailer` over the send pipeline
# (src/agent_write.rs), and a stub CredentialStore in write-client tests.
async-trait = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# To decode what the compression layer produced, in the test that proves a
# gzipped body is the plain one.
flate2 = "1"
