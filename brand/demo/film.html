<!doctype html>
<!-- The demo film, 1920x1080. render.ts steps it one frame at a time through
     window.seek(frame) and screenshots each, so nothing here may run on the
     wall clock: requestAnimationFrame, performance.now and Math.random are all
     replaced before any other script loads. -->
<html><head><meta charset="utf-8">
<script>
  window.__raf = [];
  window.__now = 0;
  window.requestAnimationFrame = (cb) => (window.__raf.push(cb), window.__raf.length);
  window.cancelAnimationFrame = () => {};
  performance.now = () => window.__now;
  // mulberry32: the same film on every render.
  let seed = 0x5eed1e55;
  Math.random = () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
</script>
<style>
@font-face { font-family: "Newsreader"; src: url("newsreader-var.woff2") format("woff2"); font-weight: 200 800; }
</style>
</head>
<body>
  <script src="film.js"></script>
</body></html>
