# The alerts. Every one of them is something that happened, or that
# deploy/monitoring/README.md said we should be told about and nothing told us.
#
# WHY NoData IS OK ON EVERY RULE: when carrier stops reporting,
# every query here goes empty at once, and six alerts saying "I cannot see" is
# noise around the one that matters. `carrier-metrics-missing` is that one.
#
# `$labels` and `$values` are written bare, and that was checked rather than
# assumed: Grafana 12.2 does NOT run env-var interpolation over alert rules, so
# the `$$` escape the other provisioning files would need arrives here as a
# literal `$$` and breaks every summary.
apiVersion: 1
groups:
  - orgId: 1
    name: tenants
    folder: Passband
    interval: 1m
    rules:
      # 2026-09-28: the tenants ResourceQuota had been full at five for who
      # knows how long, and the first anyone heard of it was a new user stuck
      # on a signup that timed out. Every dimension, not just memory: on the
      # 16 GB box cpu, ephemeral storage, pods and PVCs all used to bind before
      # memory did (PRODUCTION.md, "How many tenants fit").
      - uid: tenants-quota-near-full
        title: Tenants quota near full
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'tenants quota: {{ $labels.resource }} at {{ humanizePercentage $values.A.Value }}'
          description: >-
            Signups start failing when any dimension reaches 100%: the warden applies the
            Deployment, the pod is refused, and the user sees a timeout.
            Add RAM or raise the quota (PRODUCTION.md, "How many tenants fit").
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                max by (resource) (
                  kube_resourcequota{namespace="tenants",type="used"}
                    / ignoring(type) kube_resourcequota{namespace="tenants",type="hard"}
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0.8] }

      # The quota is a file in git (deploy/hosted/70-tenant-limits.yaml), and
      # for a while after 2026-09-28 it was not: a `kubectl patch` raised it
      # on the box, the file kept the old numbers, and an apply of the file
      # would have put the cap back. The warden's test can hold the file to
      # the ConfigMap; only the scrape can see the box. So: a hard line of the
      # quota changing, or a line appearing that was not there an hour ago,
      # or one going that was, is expected once, right after an apply of the
      # file, and otherwise means the box has moved away from the record.
      # All three are read per line (`max by (resource)`), so two
      # kube-state-metrics pods during its rollout do not double anything,
      # and a gap in the scrape contributes no points, so it is not a change.
      # The quota being deleted outright is `carrier-metrics-missing`, which
      # watches these very series.
      - uid: tenants-quota-changed
        title: Tenants quota changed on the box
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: 'tenants quota: {{ $labels.resource }} hard limit changed'
          description: >-
            A hard line of the tenants ResourceQuota changed. Expected right after
            `kubectl apply -f deploy/hosted/70-tenant-limits.yaml`; otherwise the box was
            patched and the file no longer records it (PRODUCTION.md, "How many tenants fit"):
            put the change in the file, or apply the file.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                changes(max by (resource) (kube_resourcequota{namespace="tenants",type="hard"})[1h:])
                  or label_replace(
                    count(max by (resource) (kube_resourcequota{namespace="tenants",type="hard"})
                      unless max by (resource) (kube_resourcequota{namespace="tenants",type="hard"} offset 1h)),
                    "resource", "a line that was not there an hour ago", "", "")
                  or label_replace(
                    count(max by (resource) (kube_resourcequota{namespace="tenants",type="hard"} offset 1h)
                      unless max by (resource) (kube_resourcequota{namespace="tenants",type="hard"})),
                    "resource", "a line that is gone", "", "")
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The general form of the same night: a tenant whose Deployment wants a
      # pod and has none available. Quota, scheduling, image pull, crash loop,
      # a probe that never passes; this does not care which. Ten minutes is
      # well past the 30s minReadySeconds soak and a Recreate roll. A tenant
      # stopped on purpose is scaled to 0 and so never fires.
      #
      # `squelch-embed` lives in the same namespace and is not a tenant: its
      # own rule (`squelch-embed-down`, below) says what its absence means,
      # and this rule's description would send whoever reads it to the wrong
      # pod. So it is left out by name, on both sides of the subtraction.
      - uid: tenant-no-available-pod
        title: Tenant has no running pod
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'tenant {{ $labels.deployment }} has no available pod'
          description: >-
            The mailbox is down. `kubectl -n tenants get events | grep {{ $labels.deployment }}`
            for a refused or unschedulable pod, `kubectl -n tenants describe pod -l
            app.kubernetes.io/instance={{ $labels.deployment }}` for one that is failing.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                kube_deployment_spec_replicas{namespace="tenants",deployment!="squelch-embed"}
                  - kube_deployment_status_replicas_available{namespace="tenants",deployment!="squelch-embed"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The one README.md has recommended since the metrics shipped: a pod can
      # be Running, Ready and stuck since Tuesday, and only the daemon knows.
      # A timestamp of 0 (never synced since start) fires too, on purpose.
      #
      # ONE SERIES PER TENANT, NOT PER POD. The raw series carries `instance`,
      # the pod IP, so every pod restart was a new alert: the old pod's series
      # vanished ("resolved"), the new pod's started at 0, and 15 minutes later
      # a tenant who had been stale the whole time was announced as stale
      # again. A daemon roll did that to every stale tenant at once (2026-10-08,
      # three in half an hour). `max by` drops the pod from the identity and
      # takes the freshest sync any of the tenant's pods has reported;
      # `last_over_time` holds the old pod's last value across the gap before
      # the new pod is scraped, so the alert neither resolves nor restarts.
      - uid: tenant-sync-stale
        title: Tenant mail sync stale
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'tenant {{ $labels.tenant }} has not synced in 15+ minutes'
          description: >-
            One tenant: usually a dead Google refresh token (its
            squelchd_gmail_api_errors_total{kind="auth"} climbs) and the user has to reconnect.
            Every tenant at once: the box, or Google.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: time() - max by (cluster, tenant) (last_over_time(squelchd_sync_last_success_timestamp_seconds[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [900] }

      # A container in `tenants` killed for memory, the moment it happens. On
      # the shared embedder a tenant daemon runs under a 512Mi limit sized from
      # August measurements of a daemon with no session (SETUP.md §10b, "Before
      # step 9"), so this is the rule that says the number was wrong, one
      # tenant at a time, before the crash loop is long enough for
      # `tenant-no-available-pod`. It covers `squelch-embed` too, on purpose.
      #
      # The reason gauge alone is not an event: kube-state-metrics keeps
      # reporting OOMKilled as the LAST termination reason until the container
      # terminates for some other reason, which can be weeks. So it fires only
      # while the restart counter has also moved in the last 15 minutes, which
      # makes it one firing per kill (or per run of kills) rather than a
      # permanent one. `max by` for the two kube-state-metrics pods of a
      # rollout, as above.
      - uid: tenant-oomkilled
        title: Pod in tenants OOM-killed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.pod }} ({{ $labels.container }}) was OOM-killed'
          description: >-
            The container hit its memory limit and was restarted. Read PRODUCTION.md, "If a tenant
            is OOM-killed, read the constraint first", before raising anything. On the shared
            embedder, more than one tenant doing this is the 512Mi limit being too small: pin
            SQUELCH_WARDEN_MEMORY_LIMIT in 15-warden-config.yaml and redo 70-tenant-limits.yaml.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                max by (pod, container) (
                  kube_pod_container_status_last_terminated_reason{namespace="tenants",reason="OOMKilled"}
                )
                  and on (pod, container)
                max by (pod, container) (
                  increase(kube_pod_container_status_restarts_total{namespace="tenants"}[15m])
                ) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 2026-09-29: memory is what carrier runs out of first, and the only
      # wall it has is the RAM itself. Nothing is reserved for k3s and there
      # is no swap (PRODUCTION.md, "The box"), so past 100% is a global OOM
      # that kills whichever tenant daemon is biggest. MemAvailable counts
      # reclaimable page cache as free, so this is memory actually held. 85%
      # of 16 GB leaves ~2.4 GB, a handful of tenants loading the embedder at
      # once. Asked for as "ever goes over", so 2m: two evaluations in a row,
      # enough to drop a single odd scrape and nothing more. If the embedder
      # sawtooth makes it chatty, raise this rather than the threshold.
      - uid: carrier-memory-high
        title: carrier memory high
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'carrier memory at {{ humanizePercentage $values.A.Value }}'
          description: >-
            The box is close to a global OOM, which kills the largest tenant daemon.
            "Memory used" on the dashboard shows who grew ("of which tenant daemons");
            "Memory by pod" names them. Resize RAM (CPU and RAM only) before adding
            tenants (PRODUCTION.md, "How many tenants fit").
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0.85] }

      # The disk: the tenant volume and the root disk, the two the dashboard
      # graphs. A tenant's claim is nominal (10Gi each on a 50 GB volume,
      # deploy/hosted/70-tenant-limits.yaml) and local-path enforces nothing,
      # so the quota guards the number of claims and this guards the disk
      # itself. A full volume is every tenant's SQLite failing to write at
      # once; the volume grows online (SETUP.md, "Tenant data on a block
      # volume"), which is what to do when this fires.
      - uid: carrier-disk-high
        title: carrier disk high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'carrier {{ $labels.mountpoint }} at {{ humanizePercentage $values.A.Value }}'
          description: >-
            The filesystem is filling. /mnt/tenant-data is every tenant's mail index and
            grows online (expand the volume, then resize2fs: SETUP.md); / is the root disk,
            where k3s images and the journal live. "Disk used" on the dashboard shows the trend.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                1 - node_filesystem_avail_bytes{mountpoint=~"/|/mnt/tenant-data", fstype!~"tmpfs|ramfs"}
                  / node_filesystem_size_bytes{mountpoint=~"/|/mnt/tenant-data", fstype!~"tmpfs|ramfs"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0.85] }

      # The alert that makes the others worth trusting. Everything above reads
      # series the Prometheus agent on carrier remote-writes; when the box, the
      # agent or kube-state-metrics goes away they all fall silent together.
      - uid: carrier-metrics-missing
        title: carrier metrics missing
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'no metrics from carrier for 10+ minutes'
          description: >-
            Every other alert is blind until this clears. The box, the Prometheus agent
            (monitoring namespace), or kube-state-metrics is down, or remote write to
            metrics.passband.app (the monitor box's Prometheus) is failing.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: absent_over_time(kube_resourcequota{namespace="tenants",type="hard"}[10m])
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  # The shared embedding service (deploy/hosted/65-embed.yaml,
  # docs/EMBED-SERVICE.md). One pod that every tenant on the shared embedder
  # depends on for vectors: while it is down, those tenants embed nothing and
  # search is keyword-only. Mail sync is unaffected, which is why nothing
  # else here would notice.
  - orgId: 1
    name: embedding
    folder: Passband
    interval: 1m
    rules:
      # A missing scrape target reads exactly like an idle service, so this
      # does not trust the service's own series to be there. It asks two
      # questions: is the session ready, and, if no series says either way,
      # does the Deployment exist (kube-state-metrics, which sees it whether
      # or not the pod is scraped). Session ready = 0, a pod that is crash
      # looping, a scrape that broke, and a NetworkPolicy that stopped
      # admitting the agent all come out as 1.
      #
      # It stays silent until 65-embed.yaml is applied, because before that
      # the Deployment does not exist and the expression is empty, and an
      # empty result is OK here like everywhere else in this file: the one
      # case it would otherwise catch, carrier going dark, is
      # `carrier-metrics-missing`'s. That leaves one hole, said out loud: the
      # Deployment deleted while tenants are still pointed at it reads as
      # "not installed". SETUP.md §10b's rollback deletes it only after the
      # last tenant has rolled back, and nothing else should.
      - uid: squelch-embed-down
        title: Embedding service down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'squelch-embed is not serving'
          description: >-
            Every tenant on the shared embedder is getting no vectors: new mail is stored but
            not embedded, and search is keyword-only until this clears. `kubectl -n tenants
            describe pod -l app.kubernetes.io/name=squelch-embed` and `kubectl -n tenants logs
            deploy/squelch-embed`; the last line of a pod that exited says why. If the pod is
            Running and Ready, the scrape is what broke: check up{job="squelch-embed"}.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                (1 - max(squelch_embed_session_ready{job="squelch-embed"}))
                  or on ()
                (max(kube_deployment_spec_replicas{namespace="tenants",deployment="squelch-embed"}) > bool 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The refusals that are never the design working. `unauthorized` is a
      # token mismatch (a tenant started before the Secret existed, or the
      # Secret changed); `not_ready` past a restart is a session that will
      # not come up; `error` is inference failing. `queue_full` on the
      # INTERACTIVE lane is searches being turned away, which the lane's
      # share exists to prevent, and on lane `none` it is the server out of
      # body permits (`BODY_PERMITS` in squelch-embed/src/http.rs), which
      # turns away every caller before it has a lane. Backfill 429s during a
      # signup are expected and are not here.
      #
      # A rate over 5m held for 10m, so the few seconds of `not_ready` a
      # Recreate rollout costs cannot fire it: that blip leaves the window
      # after five minutes, before `for` is satisfied.
      - uid: squelch-embed-errors
        title: Embedding service refusing requests
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'squelch-embed: {{ $labels.outcome }} on the {{ $labels.lane }} lane'
          description: >-
            unauthorized: a token mismatch; the tenants that started before the Secret did are the
            ones to roll (SETUP.md §10b, step 7). not_ready: the session is down; see the pod's log.
            error: inference is failing. queue_full on interactive or none: searches, or every
            request, are being refused, which means one or more tenants are flooding the service;
            see "One tenant can slow every other" in SETUP.md §10b.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                sum by (outcome, lane) (
                  rate(squelch_embed_requests_total{job="squelch-embed",outcome=~"unauthorized|error|not_ready"}[5m])
                )
                  or
                sum by (outcome, lane) (
                  rate(squelch_embed_requests_total{job="squelch-embed",outcome="queue_full",lane=~"interactive|none"}[5m])
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # The pod against its own limit (768Mi today, so 0.85 is about 650Mi).
      # Read as a ratio of container_spec_memory_limit_bytes rather than a
      # literal, so a changed limit in 65-embed.yaml moves the threshold with
      # it. The memory bound is the texts in one forward pass, and the built
      # image peaked at 290 MB under load (65-embed.yaml's header), so this
      # firing is something new: a model, a bound or a leak, not traffic.
      - uid: squelch-embed-memory-high
        title: Embedding service near its memory limit
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'squelch-embed at {{ humanizePercentage $values.A.Value }} of its memory limit'
          description: >-
            An OOM kill of this pod is every shared-embedder tenant without vectors until it
            restarts. Nothing about tenant count should move this; compare with the last
            release's peak before raising the limit in 65-embed.yaml.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                max by (pod) (container_memory_working_set_bytes{namespace="tenants",container="squelch-embed"})
                  / max by (pod) (container_spec_memory_limit_bytes{namespace="tenants",container="squelch-embed"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0.85] }

  # A tenant out of triage budget. Nothing is broken and nothing crashes: mail
  # keeps syncing and simply stops being judged, which is why no other rule
  # here notices. Two kinds of budget, three rules:
  #
  # - The daemon's DAILY run caps (`[agent].daily_run_cap` and its lanes),
  #   reset at 00:00 UTC. Read from squelchd_triage_daily_runs against
  #   squelchd_triage_daily_run_cap, which already includes any one-day grant,
  #   so a `squelchd triage grant` clears the alert on the next scrape.
  # - The MONTHLY dollar budget on the tenant's Bifrost virtual key. The
  #   daemon cannot tell it apart from the other config-shaped 4xx (it lands
  #   in squelchd_llm_config_failures_total with a bad key or a rejected
  #   model), so that rule says "budget first" and names the other two.
  #
  # Every rule is one series per tenant (`max by (cluster, tenant, ...)`, with
  # `last_over_time` across the scrape gap a pod roll leaves), for the reason
  # `tenant-sync-stale` gives: per pod, every daemon roll re-announced every
  # tenant that was already out of budget. The daily gauges come from the
  # tenant's database, so a new pod reports the same numbers as the old one.
  - orgId: 1
    name: triage-budget
    folder: Passband
    interval: 1m
    rules:
      # The one that matters most: the total cap is spent, so newly arrived
      # mail is parked until midnight UTC instead of triaged. Fires once and
      # resolves at the reset (or on a grant). `cap > 0` leaves out a daemon
      # with the cap configured to nothing, which is not "out of budget".
      - uid: tenant-triage-daily-cap
        title: Tenant out of daily triage runs
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'tenant {{ $labels.tenant }} spent its daily triage cap: new mail goes untriaged until 00:00 UTC'
          description: >-
            Mail still syncs; it is just not judged until the reset. "Daily triage runs, share of
            cap" and "Triage jobs held" on the dashboard show how fast it got there. A real mail
            day: `kubectl -n tenants exec deploy/{{ $labels.tenant }} -- squelchd triage grant
            <runs>` (a grant is spend against the monthly Bifrost budget). A loop or a rule
            fan-out: find that first, a grant only feeds it.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                max by (cluster, tenant) (last_over_time(squelchd_triage_daily_runs{scope="total"}[10m]))
                  - max by (cluster, tenant) (last_over_time(squelchd_triage_daily_run_cap{scope="total"}[10m]) > 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0] }

      # The lanes under the total: access (sent, spam and archive rows an
      # agent asked to read) and revisits, which answer to
      # `[revisit].daily_cap` and export no run gauge, so they are read from
      # the jobs they hold. One message a day per tenant per lane at most,
      # since it resolves at the reset.
      #
      # The BACKGROUND lane is left out on purpose (2026-11-04). Its cap is
      # how an onboarding backlog drains (200 a day, so a new mailbox sits at
      # it daily for weeks), which made it a message a day per new signup
      # saying the design was working. Its share-of-cap panel is still on the
      # dashboard.
      - uid: tenant-triage-lane-cap
        title: Tenant triage lane at its daily cap
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: 'tenant {{ $labels.tenant }}: triage {{ $labels.scope }} lane at its daily cap'
          description: >-
            access: a heavy day of access checks waiting for tomorrow. revisit: autonomous revisits
            parked by [revisit].daily_cap, which a grant does not raise. New mail is not held by
            any of these; that is `tenant-triage-daily-cap`.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                (
                  max by (cluster, tenant, scope) (last_over_time(squelchd_triage_daily_runs{scope="access"}[10m]))
                    - max by (cluster, tenant, scope) (last_over_time(squelchd_triage_daily_run_cap{scope="access"}[10m]) > 0)
                ) >= 0
                  or
                max by (cluster, tenant, scope) (last_over_time(squelchd_triage_jobs_held{scope="revisit"}[10m])) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [0] }

      # The monthly budget (2026-10-05: ellie's $75 key was spent and triage
      # stalled for days before anyone looked). A spent budget is a 402 on
      # EVERY call, so the counter climbs steadily; one stray 4xx does not
      # hold for 15 minutes. Per tenant, so a fleet-wide key or model problem
      # arrives as one message per tenant, and several at once is the hint
      # that it is not a budget.
      - uid: tenant-llm-config-failing
        title: Tenant LLM calls refused (budget, key or model)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'tenant {{ $labels.tenant }}: gateway refusing LLM calls, triage stalled'
          description: >-
            Usually the tenant's monthly Bifrost budget is spent: read it with a GET on
            /api/governance/virtual-keys and top it up with `squelch-control llm topup
            {{ $labels.tenant }}` (ECS Exec on control). Every tenant at once is not a budget:
            a rejected model (the 2026-08-19 class: `squelch-control llm sync --check`) or a
            bad key. Rows stay queued and drain after the fix.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (cluster, tenant) (increase(squelchd_llm_config_failures_total[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
