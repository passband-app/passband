# The IMAP test bed's overrides on top of the image's own config
# (dovecot/dovecot ships conf.d/*.conf; this sorts last, so it wins).
# Started by scripts/imap-dev.sh. DEV ONLY: one user, a password from the
# environment, cleartext login allowed (the port is bound to 127.0.0.1 only).

# Cleartext LOGIN without TLS. The daemon refuses plaintext to anything but
# loopback (contract §9); this is the loopback case it exists for.
auth_allow_cleartext = yes

# A certificate the script mints for `localhost` / 127.0.0.1 from its own
# throwaway CA, so a TLS client can VERIFY it (no accept-invalid-certs).
ssl_server {
  cert_file = /etc/squelch-dev/tls/server.crt
  key_file = /etc/squelch-dev/tls/server.key
}

# RFC 6154 SPECIAL-USE folders, created and subscribed for every user.
# Archive has no Gmail twin: it is where a MOVE test files mail away.
namespace inbox {
  separator = /
  inbox = yes
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
}

# Push quickly while IDLE so the "new mail within seconds" check is honest.
imap_idle_notify_interval = 10s
