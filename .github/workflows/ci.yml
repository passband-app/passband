# PR gate: build + test the Rust workspace when a PR (or a merge to main)
# touches it. The Passband swiftc suites are the same idea for the client, in
# ci-passband.yml. Release publishing stays in the release-*.yml workflows;
# this workflow never pushes anything.
#
# Path-filtered so a client-only or docs-only PR does not build the workspace.
# The filter is the workspace's real input set: every member crate (all named
# squelch-* or squelchd; the glob also catches a crate added later without
# anyone editing this list, and would catch any squelch-* directory, crate or
# not), the two Cargo manifests, the toolchain pin, and the hosted deploy
# directory (squelch-warden's quota test reads six of its manifests with
# include_str!, and is the one gate on a quota line that would refuse a
# signup, so a PR that edits only one of those files has to run it; the glob
# is the whole directory, its docs included, so the list here cannot fall
# behind the test's, at the price of one Rust job for a hosted-docs PR).
# Nothing else under deploy/, docs/, scripts/ or passband/ reaches a Rust
# build — every other include_str! points inside its own crate and there is
# no build.rs — so a change there is correctly not a reason to run this.
#
# The path filter applies to pushes to main only. On a PR the workflow always
# starts, a `changes` job decides whether the Rust work is needed, and the
# `gate` job always reports a result. `gate` is the check branch protection
# requires: it passes when the Rust jobs passed or were correctly skipped (no
# Rust change, or a draft PR), and fails otherwise. Do not require `rust` or
# `deny` directly; a skipped job is what a docs-only PR is supposed to get.
#
# `deny` (cargo-deny: advisories, licenses, banned and unknown sources) runs
# with the Rust job, and weekly on a schedule, because a new RustSec advisory
# lands against an unchanged Cargo.lock.
#
# WHAT IS DELIBERATELY ABSENT:
#
# - The embedding-model E2E. squelch-core's real-fastembed tests gate
#   themselves behind SQUELCH_EMBED_E2E precisely so CI does not download the
#   model on every run; leave that env var unset here.
# - The Passband suites. Those live in ci-passband.yml, path-filtered to
#   passband/**, so a Rust-only PR never spins up a 10x-billed macOS runner.

name: ci

on:
  pull_request:
    # ready_for_review: a draft skips the Rust jobs, so marking it ready has
    # to start a run. See "Draft PRs" in CLAUDE.md.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * 1" # Mondays: cargo-deny against new advisories
  push:
    branches: [main]
    paths:
      - "squelch-*/**"
      - "squelchd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - "deploy/hosted/**"

# A force-push or rapid follow-up commit obsoletes the previous run; cancel it
# rather than queue behind it. On main, never cancel — every merge gets a run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What this run has to do. On a push the workflow-level path filter has
  # already decided; on a schedule only `deny` runs; on a PR the same path set
  # is checked here, so the workflow (and `gate`) always reports.
  #
  # `tested` is the push-to-main shortcut. A PR run tests refs/pull/N/merge,
  # which is the PR merged onto main as main stood then. When nothing else
  # landed in between, the merge commit on main has that exact tree, and
  # running the same tree twice buys nothing. A passing PR run records its
  # tree as an artifact named rust-passed-<tree>; a push whose tree has one
  # sets `tested`, and `rust` skips its build. A tree no PR tested (main moved
  # under the PR, a direct push) runs in full as before.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
      actions: read # the rust-passed-<tree> artifact lookup
    outputs:
      rust: ${{ steps.out.outputs.rust }}
      deny: ${{ steps.out.outputs.deny }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          n=$(gh api "repos/$REPO/actions/artifacts?name=rust-passed-$TREE" \
            --jq '[.artifacts[] | select(.expired | not)] | length' || echo 0)
          tested=$([ "${n:-0}" -gt 0 ] && echo true || echo false)
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE passing PR runs=$n tested=$tested"
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "squelch-*/**"
              - "squelchd/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
              - "deploy/hosted/**"
              # squelch-embed's tests read it, and the image builds from it.
              - "Dockerfile.embed"
            deny:
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"
              - ".github/workflows/ci.yml"
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          F_RUST: ${{ steps.filter.outputs.rust }}
          F_DENY: ${{ steps.filter.outputs.deny }}
        run: |
          case "$EVENT" in
            push) rust=true; deny=true ;;
            schedule) rust=false; deny=true ;;
            pull_request)
              if [ "$DRAFT" = true ]; then rust=false; deny=false
              else rust=$F_RUST; deny=$([ "$F_RUST" = true ] || [ "$F_DENY" = true ] && echo true || echo false)
              fi ;;
            *) rust=false; deny=false ;;
          esac
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "deny=$deny" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT draft=$DRAFT rust=$rust deny=$deny"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # squelch-control's store tests run against a real Postgres — the store IS
    # Postgres now, and a fake would test the fake. The container boots in
    # parallel with checkout/toolchain; everything else in the workspace
    # ignores it. Clippy compiles the tests but runs none, so only the test
    # step gets the URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Two things keep the workspace inside the runner's disk. The hosted
    # ubuntu image ships ~13 GB free on / and this job needs ~11 GB of it (a
    # 4.5 GB restored target that grows to ~10 GB), so it first drops the
    # toolchains it never touches. Measured 2026-10-08: .NET 17 s for 6 GB,
    # ghcup 4 s for 4 GB, CodeQL 10 s for 1 GB, and the Android SDK 133 s for
    # 11 GB. The SDK is left alone on purpose: the other three leave ~13 GB
    # spare at the end of the job, and its deletion was two thirds of the
    # step. (Not in the background either: that was tried, and an rm
    # competing with the cache restore and clippy for the one disk freed 5 GB
    # in five minutes. There is no second disk on this image to build on.)
    # The other half is debuginfo:
    # `cargo test --workspace` links one binary per test target with the whole
    # dependency tree inside it, and at the default `debug = 2` those binaries
    # are several hundred MB each. Line tables keep panic backtraces readable
    # and cut the target dir by roughly two thirds. The env var is part of the
    # rust-cache key, so flipping it starts a fresh cache rather than mixing
    # artifacts of two debuginfo levels.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No-arg install reads rust-toolchain.toml — the pinned channel and its
      # clippy/rustfmt components — so the workflow never states a version the
      # toml would then fight. A floating `stable` here broke the very first
      # run: its newer clippy knew lints the local toolchain does not.
      # (Before the cache probe: rustc's version is part of the cache key.)
      - name: toolchain
        run: rustup toolchain install

      # The skip has one cost: main's run is what saves the cache every PR
      # restores from (a PR can read main's cache, never another PR's). So a
      # tested tree skips only when main already holds the exact cache key.
      # When it does not (Cargo.lock or the toolchain changed, or the entry
      # aged out after 7 idle days) the job runs in full and saves it.
      - name: cache probe
        id: probe
        if: needs.changes.outputs.tested == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: true
          save-if: false

      - name: decide
        id: run
        env:
          TESTED: ${{ needs.changes.outputs.tested }}
          CACHED: ${{ steps.probe.outputs.cache-hit }}
        run: |
          if [ "$TESTED" = true ] && [ "$CACHED" = true ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "a passing PR run tested this exact tree and main's cache is warm: skipping"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "tested=$TESTED cache-hit=$CACHED: full run"
          fi

      # One directory at a time, with the clock and df after each, so the log
      # keeps saying which of these are worth their seconds. If the build
      # outgrows the headroom (see "disk after"), /usr/local/lib/android is
      # the next 11 GB, at ~130 s.
      - name: free disk
        if: steps.run.outputs.full == 'true'
        run: |
          df -h / | tail -1
          for d in /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            start=$(date +%s)
            sudo rm -rf "$d"
            echo "$d: $(( $(date +%s) - start ))s, $(df -h / | tail -1 | awk '{print $4}') free"
          done

      # Caches ~/.cargo and target/ keyed on the lockfile; the ONNX (ort)
      # build under fastembed is the expensive part, and this is what keeps
      # it from recompiling on every PR.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.run.outputs.full == 'true'

      # `cargo test` links one binary per test target (fifty-odd here), each
      # carrying the whole dependency tree, ONNX included. mold links them in a
      # fraction of bfd's time; measured on the test build it was worth 0-40 s
      # of a ~3.5 min step, inside run-to-run noise, and costs 2 s to install.
      # make-default (the action's default) puts it on PATH as `ld`, so no
      # RUSTFLAGS change and the rust-cache key stays what it was.
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: steps.run.outputs.full == 'true'

      # BEFORE clippy on purpose: a formatting diff is the cheapest possible
      # failure and there is no reason to spend a compile discovering it. The
      # toolchain install above carries rustfmt from rust-toolchain.toml, so
      # the gate and a local `cargo fmt` can never disagree about the version.
      - name: fmt
        if: steps.run.outputs.full == 'true'
        run: cargo fmt --all --check

      - name: clippy
        if: steps.run.outputs.full == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # --no-fail-fast so a red PR reports every failing binary, not the first.
      #
      # Eight test threads on a four-core runner: the slow tests here mostly
      # sit on a clock (a 30 s token expiry, eight 5 s relay retries, a 7 s
      # backoff) rather than a core, and libtest runs a binary's tests on
      # cores-many threads by default, so those waits queued behind each other.
      # Not cargo-nextest: it was tried (process per test) and the spawn cost
      # of 3,650 tests on binaries this large doubled the work instead.
      - name: test
        if: steps.run.outputs.full == 'true'
        run: cargo test --locked --workspace --no-fail-fast -- --test-threads=8
        env:
          SQUELCH_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

      # The PR half of `tested` (see the changes job): this tree passed fmt,
      # clippy and the tests, so a push to main with the same tree need not
      # run them again. Fourteen days covers a PR that sits ready a while.
      - name: record tested tree
        id: tree
        if: github.event_name == 'pull_request' && steps.run.outputs.full == 'true'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "$tree" > tested-tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.tree.outcome == 'success'
        with:
          name: rust-passed-${{ steps.tree.outputs.tree }}
          path: tested-tree
          retention-days: 14
          overwrite: true

      # Headroom check for the comment above: what the job left free, and
      # what target/ came to.
      - name: disk after
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  deny:
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # The required check. Always runs, and fails if any job it depends on
  # failed or was cancelled; skipped counts as a pass.
  gate:
    # Unique check name: rulesets match the bare job name, and ci-passband
    # also has a gate job.
    name: ci-gate
    if: always()
    needs: [changes, rust, deny]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
