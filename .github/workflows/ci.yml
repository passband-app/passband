# PR gate: build + test the Rust workspace when a PR (or a merge to main)
# touches it. The Passband swiftc suites are the same idea for the client, in
# ci-passband.yml. Release publishing stays in the release-*.yml workflows;
# this workflow never pushes anything.
#
# Path-filtered so a client-only or docs-only PR does not build the workspace.
# The filter is the workspace's real input set: every member crate (all named
# squelch-* or squelchd; the glob also catches a crate added later without
# anyone editing this list), the two Cargo manifests, and the toolchain pin.
# Nothing under deploy/, docs/, scripts/ or passband/ reaches a Rust build —
# every include_str! points inside its own crate and there is no build.rs —
# so a change there is correctly not a reason to run this. squelch-desktop is
# retired and not a member; the glob would run on it, but nothing touches it.
#
# Consequence, same as ci-passband: do NOT mark this check required in branch
# protection. A path-skipped workflow reports no status at all, and a
# required-but-absent check leaves non-Rust PRs stuck on "expected".
#
# WHAT IS DELIBERATELY ABSENT:
#
# - The embedding-model E2E. squelch-core's real-fastembed tests gate
#   themselves behind SQUELCH_EMBED_E2E precisely so CI does not download the
#   model on every run; leave that env var unset here.
# - The Passband suites. Those live in ci-passband.yml, path-filtered to
#   passband/**, so a Rust-only PR never spins up a 10x-billed macOS runner.

name: ci

on:
  pull_request:
    paths:
      - "squelch-*/**"
      - "squelchd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "squelch-*/**"
      - "squelchd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

# A force-push or rapid follow-up commit obsoletes the previous run; cancel it
# rather than queue behind it. On main, never cancel — every merge gets a run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    # squelch-control's store tests run against a real Postgres — the store IS
    # Postgres now, and a fake would test the fake. The container boots in
    # parallel with checkout/toolchain; everything else in the workspace
    # ignores it. Clippy compiles the tests but runs none, so only the test
    # step gets the URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Two things keep the workspace inside the runner's disk. The hosted
    # ubuntu image ships ~14 GB free on / and something like 25 GB of
    # toolchains this job never touches (.NET, Android, Haskell, CodeQL);
    # dropping those (in the background, see the first step) is the cheap
    # half. The other half is debuginfo:
    # `cargo test --workspace` links one binary per test target with the whole
    # dependency tree inside it, and at the default `debug = 2` those binaries
    # are several hundred MB each. Line tables keep panic backtraces readable
    # and cut the target dir by roughly two thirds. The env var is part of the
    # rust-cache key, so flipping it starts a fresh cache rather than mixing
    # artifacts of two debuginfo levels.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The deletion is 40-120 s of pure I/O that nothing before the test
      # build needs, so it runs in the background behind checkout, toolchain,
      # cache restore and clippy (two minutes, comfortably longer). Output goes
      # to a file because the runner holds a step open for as long as anything
      # still has its stdout. The "disk is free" step below waits for the
      # marker before the build that actually needs the room.
      - name: free disk (in the background)
        run: |
          df -h / | tail -1
          nohup sh -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; \
            touch "$RUNNER_TEMP/disk-freed"' > "$RUNNER_TEMP/free-disk.log" 2>&1 &

      - uses: actions/checkout@v4

      # No-arg install reads rust-toolchain.toml — the pinned channel and its
      # clippy/rustfmt components — so the workflow never states a version the
      # toml would then fight. A floating `stable` here broke the very first
      # run: its newer clippy knew lints the local toolchain does not.
      - name: toolchain
        run: rustup toolchain install

      # Caches ~/.cargo and target/ keyed on the lockfile; the ONNX (ort)
      # build under fastembed is the expensive part, and this is what keeps
      # it from recompiling on every PR.
      - uses: Swatinem/rust-cache@v2

      # `cargo test` links one binary per test target (fifty-odd here), each
      # carrying the whole dependency tree, ONNX included. With the default
      # bfd linker that is the long tail of the test build; mold links the same
      # binaries in a fraction of the time. make-default (the action's default)
      # puts it on PATH as `ld`, so no RUSTFLAGS change and the rust-cache key
      # stays what it was.
      - uses: rui314/setup-mold@v1

      # cargo-nextest runs every test target's tests through one scheduler,
      # process per test, so the slow suites (the 40 s squelch-core unit
      # binary, the auth flows that sit through real timeouts) overlap instead
      # of queueing behind each other the way `cargo test` runs them, one
      # binary at a time. Prebuilt binary, a few seconds; a cargo install
      # would be minutes. nextest does not run doctests; the workspace has none
      # that assert anything (every Doc-tests section reports 0 passed).
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # BEFORE clippy on purpose: a formatting diff is the cheapest possible
      # failure and there is no reason to spend a compile discovering it. The
      # toolchain install above carries rustfmt from rust-toolchain.toml, so
      # the gate and a local `cargo fmt` can never disagree about the version.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: disk is free
        run: |
          for _ in $(seq 180); do
            [ -e "$RUNNER_TEMP/disk-freed" ] && break
            sleep 1
          done
          [ -e "$RUNNER_TEMP/disk-freed" ] || { cat "$RUNNER_TEMP/free-disk.log"; exit 1; }
          df -h / | tail -1

      # --no-fail-fast so a red PR reports every failing test, not the first.
      - name: test
        run: cargo nextest run --workspace --no-fail-fast
        env:
          SQUELCH_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
