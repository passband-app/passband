# Prometheus on the AWS `monitor` box (deploy/aws/monitor/compose.yaml): the
# storage half of hosted monitoring. Baked into the image by
# deploy/aws/monitor/Dockerfile.prometheus.
#
# Metrics arrive two ways:
#   1. remote_write PUSHED from prometheus-agent on carrier (see
#      deploy/hosted/80-monitoring.yaml) to https://metrics.passband.app, the
#      ALB route to this box's :9090.
#   2. Blackbox probes scraped from here, so uptime is measured from OUTSIDE
#      the box being watched. A dead carrier still produces probe_success==0.
#
# Auth: every route (including /api/v1/write) sits behind basic auth via
# web.yml, which the entrypoint renders from env at boot. The scrape of our own
# blackbox sidecar rides the compose network and needs no auth; blackbox has no
# published port and no ALB route.

global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://signup.passband.app/healthz
          - https://warden.passband.app/healthz
          - https://relay.squelch.sh/healthz
          - https://passband.app/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # THE LLM CANARY: a real claude-opus-5 call through the public gateway path
  # every tenant daemon uses, mirroring the daemon's full request shape, with a
  # dedicated canary virtual key (see deploy/monitoring/blackbox/blackbox.yml).
  # probe_success{job="blackbox-bifrost-llm"} == 0 means LLM calls are NOT
  # going through in production.
  #
  # Its own job because it spends real money per probe, and the interval is a
  # COST knob, not a freshness one. Measured against the gateway's budget
  # ledger, a probe costs about $0.0014 (about $4/month at 15m, $12/month at
  # 5m); a one-field verdict at low effort is far below the 2000-token
  # ceiling. Re-measure from the ledger rather than from the token ceiling if
  # you change the interval.
  #
  # WHATEVER THIS INTERVAL BECOMES, the Grafana panel's last_over_time window
  # must stay wider than it. An instant query looks back 5m, so at 15m the
  # series is simply absent two thirds of the time, and the panel rendered
  # that absence as NO DATA rather than as a failure. See the "LLM canary" panel in passband-health.json.
  #
  # scrape_timeout is 60s because a reasoning model on a cold prompt cache is
  # not a 10s request; it must stay >= the module's own timeout.
  - job_name: blackbox-bifrost-llm
    metrics_path: /probe
    scrape_interval: 15m
    scrape_timeout: 60s
    params:
      module: [bifrost_llm]
    static_configs:
      - targets:
          - https://bifrost.passband.app/anthropic/v1/messages
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox:9115]

  - job_name: prometheus
    basic_auth:
      username: remote
      password_file: /etc/prometheus/password
    static_configs:
      - targets: [localhost:9090]
