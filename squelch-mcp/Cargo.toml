[package]
name = "squelch-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "squelch_mcp"
path = "src/lib.rs"

[[bin]]
name = "squelch-mcp"
path = "src/main.rs"

[dependencies]
squelch-core = { path = "../squelch-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# server + macros come from default features; transport-io adds stdio.
# transport-streamable-http-server adds the (tower-based) Streamable HTTP transport,
# selected only in main(); tool logic stays transport-agnostic.
rmcp = { version = "2.1.0", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1"
# HTTP listener for the Streamable HTTP transport. rmcp gives us a tower Service;
# axum hosts it and provides graceful shutdown. Versions track rmcp 2.1.0.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
# Agent-door OAuth (src/auth.rs). The daemon is a resource server: it verifies
# AuthKit's RS256 access tokens locally against the issuer's JWKS.
# `Authorization: Bearer` parsing, shared with both other doors.
squelch-httpauth = { path = "../squelch-httpauth" }
# The SAME feature set squelch-relay uses: one crypto backend in the workspace.
# jsonwebtoken 11 panics at verify time unless exactly one of rust_crypto /
# aws_lc_rs is enabled across the build, so never add aws_lc_rs anywhere.
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
# JWKS fetch. rustls via the workspace features, like every other outbound call.
reqwest = { workspace = true }
url = { workspace = true }

[features]
# Exposes `squelch_mcp::testing` (fixture keys, a token signer, a stub JWKS
# server) to OTHER crates' tests, chiefly squelchd's router tests. Only ever
# enabled from a [dev-dependencies] entry, so no shipped binary carries it.
testing = []

[dev-dependencies]
# This crate's own integration tests use `testing` too.
squelch-mcp = { path = ".", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
# Hand-building an `alg: none` token in the auth tests.
base64 = { workspace = true }
