# Passband's pure-source Swift suites (stream decoder, pairing). test.sh
# compiles each suite with bare swiftc — no xcodegen, no signing, no
# simulator — which is the only Passband testing cheap enough to run per-PR
# on a macOS runner.
#
# A Rust-only PR never spins up a 10x-billed macOS runner: on a PR a cheap
# Linux `changes` job checks the path set first, and on a push to main the
# workflow-level path filter does. `gate` always reports, and is the check
# branch protection requires (same pattern as ci.yml): it passes when `test`
# passed or was correctly skipped (no client change, or a draft PR).
#
# A push to main also skips `test` when a PR run already passed on the same
# tree: a PR tests refs/pull/N/merge, which is exactly the merge commit's tree
# when nothing else landed in between. The passing PR run records the tree as
# an artifact named passband-passed-<tree>, and the push looks it up. Same
# idea as `tested` in ci.yml; here it saves a 10x-billed macOS run per merge.

name: ci-passband

on:
  pull_request:
    # ready_for_review: a draft skips `test`, so marking it ready has to
    # start a run. See "Draft PRs" in CLAUDE.md.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "passband/**"
      - "docs/CHANGELOG.md"
      - ".github/workflows/ci-passband.yml"

concurrency:
  group: ci-passband-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
      actions: read # the passband-passed-<tree> artifact lookup
    outputs:
      client: ${{ steps.out.outputs.client }}
    steps:
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          # Same-repo runs only: a fork's PR could otherwise upload the name
          # for a tree it never tested.
          n=$(gh api "repos/$REPO/actions/artifacts?name=passband-passed-$TREE" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' || echo 0)
          tested=$([ "${n:-0}" -gt 0 ] && echo true || echo false)
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE passing PR runs=$n tested=$tested"
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            client:
              - "passband/**"
              - "docs/CHANGELOG.md"
              - ".github/workflows/ci-passband.yml"
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          F_CLIENT: ${{ steps.filter.outputs.client }}
          TESTED: ${{ steps.tested.outputs.tested }}
        run: |
          case "$EVENT" in
            push) if [ "$TESTED" = true ]; then client=false; else client=true; fi ;;
            pull_request) if [ "$DRAFT" = true ]; then client=false; else client=$F_CLIENT; fi ;;
            *) client=false ;;
          esac
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT draft=$DRAFT client=$client"

  test:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    # macos-26 defaults to Xcode 26.x — the same major the project builds with
    # locally. macos-15 tops out at Xcode 16 / Swift 6.1 and is too old.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: test
        run: ./passband/test.sh

      # docs/CHANGELOG.md is generated from the release-note table the app
      # itself reads. The app can never show a stale note, so nothing else
      # catches the document drifting behind the table; this does.
      - name: changelog is current
        run: ./passband/make-changelog.sh --check

      # The PR half of the skip above. Fourteen days covers a PR that sits
      # ready a while before merging.
      - name: record tested tree
        id: tree
        if: github.event_name == 'pull_request'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "$tree" > tested-tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.tree.outcome == 'success'
        with:
          name: passband-passed-${{ steps.tree.outputs.tree }}
          path: tested-tree
          retention-days: 14
          overwrite: true

  # The required check. Always runs; skipped counts as a pass.
  gate:
    # Unique check name: rulesets match the bare job name, and ci also has
    # a gate job.
    name: ci-passband-gate
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
