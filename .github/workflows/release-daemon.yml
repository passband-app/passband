# Every daemon tag (daemon-X.Y.Z) builds three images and pushes them to GHCR:
# squelchd
# (self-hosting is `docker compose up` + env vars, no Rust toolchain on the
# box), squelch-warden and squelch-control (the hosted planes, so a rebuilt node
# pulls a tag instead of a human rebuilding it by hand — see
# deploy/hosted/PRODUCTION.md).
#
# ARCHITECTURES DIFFER PER IMAGE, on purpose:
#
# - squelchd is amd64 + arm64. Its Dockerfile cross-compiles the non-native arch
#   (see squelchd/Dockerfile), so one amd64 runner covers both and no emulation
#   is involved.
# - squelch-warden and squelch-control are amd64 ONLY. Their Dockerfiles build
#   natively for the runner's arch, so a second platform would mean QEMU, and
#   under emulation these compile the ONNX tree — plausibly past the six-hour
#   job ceiling, in a job that holds a registry-write token the whole time. The
#   one box that runs them (`carrier`) is amd64, so the foreign half was
#   building nothing anybody deploys. arm64 comes back when there is a native
#   arm runner or a cross-compiling Dockerfile of squelchd's shape — not by
#   re-adding binfmt.
#
# BUILD CACHE is a GHCR registry ref per image (<image>:buildcache), not
# type=gha. GitHub Actions caches are scoped to the ref that wrote them, and a
# tag run can read only its own ref's entries or the default branch's, so with
# every release on a new tag no run ever read the previous release's layers;
# mode=max meanwhile parked several GB per tag in the repo's 10 GB Actions
# cache, crowding out the rust-cache entry every PR's ci.yml run restores. A
# registry ref has no ref isolation. The Dockerfiles cook dependencies in their
# own cargo-chef layer, so a tag that changes no dependency compiles only the
# workspace crates. The packages are public, so the cache costs no quota; the
# :buildcache tag is a cache manifest, not a runnable image.
name: release-daemon

on:
  push:
    tags: ["daemon-*"]

permissions:
  contents: read
  packages: write

jobs:
  # Fail fast, before any registry write: the tag must match the Rust
  # workspace version (surfaced at runtime as squelchd_build_info), or the
  # published image would report a version other than the tag it shipped
  # under.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify tag matches workspace version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "daemon-$VERSION" ] || {
            echo "tag ${GITHUB_REF_NAME} != daemon-$VERSION (Cargo.toml workspace version)"; exit 1; }

  squelchd-image:
    runs-on: ubuntu-latest
    # Deploys to the release-daemon environment, limited to daemon-* tags,
    # which only admins may push (tag ruleset). Holds no secrets today; it
    # is where any future publishing secret goes, and the deployment log
    # records every image publish.
    environment: release-daemon
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tag == git tag, e.g. daemon-0.1.0, plus a moving latest. The
      # prefixed form can never collide with the retired numeric tags
      # (0.2.x / v0.2.x), which matters because GHCR tags are mutable and the
      # carrier node pulls IfNotPresent — a recycled number would silently
      # pin stale. latest must be explicit: type=semver used to imply it, and
      # the self-host docs tell people to pull :latest.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/squelchd
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: squelchd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/squelchd:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/squelchd:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  # The in-cluster tenant provisioner. Published so replacing the k3s node is a
  # pull rather than a hand-build on the box, which is what PRODUCTION.md's
  # registry gap was.
  warden-image:
    runs-on: ubuntu-latest
    # Deploys to the release-daemon environment, limited to daemon-* tags,
    # which only admins may push (tag ruleset). Holds no secrets today; it
    # is where any future publishing secret goes, and the deployment log
    # records every image publish.
    environment: release-daemon
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same scheme as squelchd: image tag == git tag, plus latest.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/squelch-warden
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.warden
          # amd64 only; see the header. Dockerfile.warden builds natively, and
          # emulating the ONNX build is not worth an arch nothing runs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/squelch-warden:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/squelch-warden:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  # The hosted signup plane. Railway builds its own image from this repo, so
  # this tag is for reproducibility and for anyone running the control plane
  # somewhere Railway is not.
  control-image:
    runs-on: ubuntu-latest
    # Deploys to the release-daemon environment, limited to daemon-* tags,
    # which only admins may push (tag ruleset). Holds no secrets today; it
    # is where any future publishing secret goes, and the deployment log
    # records every image publish.
    environment: release-daemon
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/squelch-control
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.control
          # amd64 only, for the reason the warden job gives.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/squelch-control:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/squelch-control:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
