# TEMPORARY: proves PassbandiOS builds under Xcode 27 before a release tag
# does. Delete before merging.
name: tmp-xcode27-probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - run: brew install xcodegen
      - run: ./passband/vendor/fetch-sparkle.sh
      - name: build PassbandiOS unsigned, Release
        working-directory: passband
        run: |
          xcodegen generate >/dev/null
          xcodebuild -project Passband.xcodeproj -scheme PassbandiOS \
            -configuration Release -destination 'generic/platform=iOS' \
            build CODE_SIGNING_ALLOWED=NO -quiet
      - name: swift suites
        run: ./passband/test.sh
