# Every passband-mac-* tag builds, signs, notarizes, and publishes the Mac
# client, then regenerates the Sparkle appcast (pushed to main, which
# redeploys the site) and bumps the Homebrew cask. The daemon's daemon-* tags
# are release-daemon.yml, iOS ships from passband-ios-* via
# release-passband-ios.yml, and the three never overlap.
#
# Secrets (see passband/RELEASING.md for how each is produced):
#   PASSBAND_CERT_P12        base64 .p12 export of the Developer ID cert
#   PASSBAND_CERT_PASSWORD   the .p12's passphrase
#   APPLE_APP_PASSWORD       app-specific password for notarytool
#   SPARKLE_PRIVATE_KEY      the EdDSA private key (generate_keys -x output)
#   TAP_PUSH_TOKEN           fine-grained PAT, contents:write on homebrew-tap
#   RELEASES_PUSH_TOKEN      fine-grained PAT, contents:write on passband-releases
#                            (TEMPORARY, see the "Mirror" step)
#   MAC_PUSH_PROFILE         OPTIONAL base64 Developer ID provisioning profile for
#                            app.passband.client with Push Notifications; without
#                            it the app ships with no APNs (passband/build.sh)
name: release-passband-mac

on:
  push:
    tags: ["passband-mac-*"]

permissions:
  contents: write

env:
  APPLE_ID: bboynton97@gmail.com
  APPLE_TEAM_ID: AAT39BQ9LV

jobs:
  release-passband:
    runs-on: macos-26
    # The signing and publishing secrets live in this GitHub environment,
    # which only this workflow's own release tags may deploy to, and only
    # admins may push those tags (tag ruleset). Another workflow or branch
    # cannot read them.
    environment: release-mac
    steps:
      # Full history: the build number is the commit count, and a shallow
      # clone would mint a tiny CFBundleVersion that breaks monotonicity.
      # persist-credentials: false so GITHUB_TOKEN is not left in git's
      # config; the one step that pushes (Publish appcast) brings its own
      # token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Two sources of truth have to agree with the tag: passband/VERSION
      # (what build.sh stamps into the app) and project.yml's macOS target
      # (what a from-scratch xcodegen build would stamp). The awk is scoped to
      # the Passband target block — a bare grep would pass whenever the iOS
      # target's version happens to match.
      - name: Verify tag matches VERSION and project.yml
        run: |
          VERSION=$(cat passband/VERSION)
          [ "${GITHUB_REF_NAME}" = "passband-mac-$VERSION" ] || {
            echo "tag ${GITHUB_REF_NAME} != passband-mac-$VERSION (passband/VERSION)"; exit 1; }
          PROJ=$(awk '/^  Passband:$/{f=1} /^  PassbandiOS:$/{f=0}
            f && /MARKETING_VERSION:/ {gsub(/"/,""); print $2; exit}' passband/project.yml)
          [ "$PROJ" = "$VERSION" ] || {
            echo "project.yml macOS MARKETING_VERSION $PROJ != $VERSION (passband/VERSION)"; exit 1; }

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.PASSBAND_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.PASSBAND_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          # In the search list, or find-identity (and codesign) can't see it.
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          # No auto-lock mid-notarization.
          security set-keychain-settings build.keychain
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm cert.p12
          # Allow codesign to use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" build.keychain > /dev/null

      - name: Store notary credentials
        env:
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials passband-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      # The Developer ID provisioning profile that lets the app hold an APNs
      # token (release announcements; see passband/build.sh). Optional: with
      # the secret unset the app ships exactly as before, without push.
      - name: Write push profile
        env:
          MAC_PUSH_PROFILE_B64: ${{ secrets.MAC_PUSH_PROFILE }}
        run: |
          if [ -z "$MAC_PUSH_PROFILE_B64" ]; then
            echo "::notice::MAC_PUSH_PROFILE is not set; this build has no push"
            exit 0
          fi
          printf '%s' "$MAC_PUSH_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/push.provisionprofile"
          echo "MAC_PUSH_PROFILE=$RUNNER_TEMP/push.provisionprofile" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        run: ./passband/build-release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat passband/VERSION)
          # The release body is the SAME text the app's What's New card shows,
          # rendered from Sources/Passband/Lib/ReleaseNotes.swift. A version
          # with no note there still ships: it gets the install line alone
          # rather than blocking a tag on prose.
          NOTES=$(mktemp)
          if ./passband/make-changelog.sh "$VERSION" > "$NOTES" 2>/dev/null; then
            printf '\n' >> "$NOTES"
          else
            : > "$NOTES"
            echo "==> no release note for $VERSION in ReleaseNotes.swift" >&2
          fi
          printf '%s\n' \
            'Existing installs get this via auto-update. New installs: unzip and drag' \
            'to Applications, or `brew install --cask passband-app/tap/passband`.' \
            >> "$NOTES"
          # The dSYM rides on THIS repo's release only, never the public
          # mirror below: it is for symbolicating crashes, not for downloads.
          gh release create "$GITHUB_REF_NAME" "passband/build/Passband-$VERSION.zip" \
            "passband/build/symbols-Passband-$VERSION.dSYM.zip" \
            --title "Passband $VERSION" \
            --notes-file "$NOTES"

      # TEMPORARY, while this repo is private: its release assets 404 for the
      # public, so every download (Sparkle, the site's button, Homebrew) goes
      # through passband.app/download to a public, releases-only mirror
      # instead (passband-site/server.ts). BEFORE the appcast on purpose: if
      # the mirror upload fails, the feed never advertises a zip nobody can
      # fetch. To undo when the repo is public again: delete this step, point
      # server.ts back at this repo, and delete passband-app/passband-releases.
      - name: Mirror the zip to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PUSH_TOKEN }}
        run: |
          VERSION=$(cat passband/VERSION)
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASES_PUSH_TOKEN is not set: downloads would 404, refusing to publish the appcast" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "passband/build/Passband-$VERSION.zip" \
            --repo passband-app/passband-releases \
            --title "Passband $VERSION" \
            --notes "Passband for Mac $VERSION. Existing installs update automatically. New installs: unzip and drag to Applications, or \`brew install --cask passband-app/tap/passband\`."

      # The feed lists exactly the zips in releases/, so hydrate it with every
      # previously shipped archive — the workflow is stateless, the releases
      # themselves are the state.
      - name: Regenerate appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Re-fetch the release tags as they are: checkout on a tag push
          # can leave the pushed tag lightweight, and make-appcast.sh reads
          # an annotated tag's message for `quiet`.
          # With the job's token: checkout does not persist credentials,
          # and this must not depend on the repo being public.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
            fetch --force --quiet origin 'refs/tags/passband-mac-*:refs/tags/passband-mac-*'
          cd passband
          mkdir -p releases
          gh release list --limit 100 --json tagName \
            --jq '.[].tagName | select(startswith("passband-mac-"))' \
          | while read -r tag; do
              gh release download "$tag" --pattern 'Passband-*.zip' \
                --dir releases --skip-existing
            done
          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_KEY" > "$KEY_FILE"
          SPARKLE_ED_KEY_FILE="$KEY_FILE" ./make-appcast.sh
          rm -f "$KEY_FILE"

      # The appcast lives on main; the tag checkout is detached, so commit it
      # from a fresh main. Pushing main redeploys the site with the new feed.
      #
      # main's ruleset requires a PR, and only repository admins and the
      # passband-release GitHub App may bypass it, so the push uses a
      # short-lived token for that App rather than GITHUB_TOKEN (which the
      # ruleset rejects). Its client ID is the release-mac environment
      # variable RELEASE_APP_CLIENT_ID and its private key the release-mac
      # secret RELEASE_APP_PRIVATE_KEY; the App has Contents: write on this
      # repo only, and the token is narrowed to that here.
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: passband
          permission-contents: write

      - name: Publish appcast
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The App's bot account authors the commit, so the history shows
          # which identity bypassed the ruleset.
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp passband-site/appcast.xml "$RUNNER_TEMP/appcast.xml"
          git checkout -- passband-site/appcast.xml
          git fetch origin main
          git switch main
          cp "$RUNNER_TEMP/appcast.xml" passband-site/appcast.xml
          git add passband-site/appcast.xml
          git commit -m "passband-site: appcast for ${GITHUB_REF_NAME#passband-mac-}"
          git pull --rebase origin main
          git push origin main

      - name: Bump Homebrew cask
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          VERSION=$(cat passband/VERSION)
          SHA=$(shasum -a 256 "passband/build/Passband-$VERSION.zip" | cut -d' ' -f1)
          git clone --depth 1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/passband-app/homebrew-tap" tap
          sed -i '' \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            tap/Casks/passband.rb
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap commit -am "passband $VERSION"
          git -C tap push
